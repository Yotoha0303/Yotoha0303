name: FeeGate Commercial Datasets Automated Harvester

on:
  schedule:
    # Runs daily at 06:00 UTC (14:00 CST)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run FeeGate Real-World Harvester
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/feegate_harvester.py

      - name: Commit and push updated datasets if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): daily automated feegate real-world datasets ingestion [skip ci]"
            git push origin main
          fi
