name: FeeGate Hourly Dataset Refresh

on:
  schedule:
    # Run once per hour; GitHub may queue scheduled runs during busy periods.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: feegate-dataset-refresh-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run FeeGate Real-World Harvester
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/feegate_harvester.py

      - name: Validate all four catalog products before publication
        run: python scripts/test_catalog_integrity.py

      - name: Commit and push updated datasets if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/feegate-ai-model-pricing-index.json \
            data/feegate-security-cve-threat-radar.json \
            data/feegate-agent-frameworks-benchmark.json \
            data/feegate-catalog-index.json
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): hourly FeeGate dataset refresh [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
