events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip Compression (Optimized for JSON payloads)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/plain;

    server {
        listen 80;
        server_name localhost;

        # Health Check Endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Data Assets Endpoint
        location /data/ {
            alias /usr/share/nginx/html/data/;
            autoindex off;

            # FeeGate Accident #19 Fix: Must expose custom and payment headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD" always;
            add_header Access-Control-Allow-Headers "Range, X-Requested-With, Authorization, Content-Type, Accept, Origin" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, X-402-Payment, Payment-Required, Digest" always;

            # FeeGate Accident #16 Fix: Explicit cache policy to prevent stale data
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            # UTF-8 JSON enforcement
            charset utf-8;
            types {
                application/json json;
            }

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type "text/plain charset=UTF-8";
                add_header Content-Length 0;
                return 204;
            }
        }
    }
}
